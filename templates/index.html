<!DOCTYPE html>
<html>
<head>
    <title>WebNews Pulse</title>

    <meta http-equiv="refresh" content="300">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .news-card {
            background: white;
            padding: 15px;
            margin: 15px auto;
            width: 80%;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        .news-card h3 {
            margin: 0;
            color: #007BFF;
        }

        .news-card p {
            color: #555;
        }

        .news-card a {
            text-decoration: none;
            color: white;
            background: #007BFF;
            padding: 8px 12px;
            border-radius: 5px;
            display: inline-block;
            margin-top: 10px;
        }

        .news-card a:hover {
            background: #0056b3;
        }

        .refresh-container {
            text-align: center;
            margin-top: 30px;
        }

        .refresh-btn {
            padding: 10px 15px;
            font-size: 16px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .refresh-btn:hover {
            background-color: #1e7e34;
        }
    </style>
</head>

<body>

    <h1>📰 WebNews Pulse</h1>

    {% if news %}
        {% for article in news %}
            <div class="news-card">
                <h3>{{ article.title }}</h3>
                <p>{{ article.description }}</p>
                <a href="{{ article.link }}" target="_blank">Read More</a>
            </div>
        {% endfor %}
    {% else %}
        <p style="text-align:center;">No news available</p>
    {% endif %}

    <!-- 🔄 Refresh Button at Bottom -->
    <div class="refresh-container">
        <button class="refresh-btn" onclick="window.location.href='/'">
            🔄 Refresh News
        </button>
    </div>

</body>
</html>
